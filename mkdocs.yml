site_name: eggcalc
site_description: Natural language math expression calculator
site_url: https://eggcalc.readthedocs.io
repo_url: https://github.com/eggstack/eggcalc
repo_name: eggstack/eggcalc
author: David Bowman

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - footnotes
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Quick Start: quickstart.md
  - User Guide:
    - CLI Usage: cli.md
    - Natural Language: natural-language.md
    - Units: units.md
    - Functions: functions.md
    - Constants: constants.md
  - Advanced:
    - Python API: api.md
    - Web Applications: webapps.md
    - Configuration: configuration.md
    - Security: security.md
  - Reference:
    - API Reference: reference.md
    - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/eggstack/eggcalc
