name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: ruff check eggcalc tests

      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: black --check eggcalc tests

      - name: Build single-file distribution
        run: |
          python build_single.py --validate
          python build_single.py

      - name: Smoke test single-file build
        run: python eggcalc.py "5+3"

      - name: Check generated docs
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/generate_mcp_docs.py --check

      - name: Test with coverage
        run: pytest tests/ -v --cov=eggcalc --cov-report=xml --cov-report=term

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

      - name: Type check
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          mypy eggcalc --ignore-missing-imports
          mypy tests/typing/consumer.py --strict --ignore-missing-imports

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distributions
        run: twine check dist/*

      - name: Install wheel in clean venv
        run: |
          python -m venv /tmp/test-venv
          /tmp/test-venv/bin/pip install dist/*.whl

      - name: Smoke test
        run: |
          /tmp/test-venv/bin/python -c "from eggcalc import evaluate; assert evaluate('2+2') == 4, 'eval failed'"
          /tmp/test-venv/bin/python -c "from eggcalc.units import UnitValue; assert UnitValue(1, 'm').convert_to('ft').value > 3, 'unit conversion failed'"

      - name: Release-surface smoke tests
        run: python scripts/smoke_release_surfaces.py
