name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: ruff check eggcalc tests

      - name: Strict migrated-module lint
        if: matrix.os == 'ubuntu-latest'
        run: ruff check --select E,F,I,UP,B,B904,C4 --ignore E501,E741,E402,B006,B007,B904,B905,C414,C416,F841,W293 eggcalc/units.py eggcalc/mcp/server.py eggcalc/_protocol.py eggcalc/_version.py build_single.py

      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: black --check eggcalc tests

      - name: Type check
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          mypy eggcalc --ignore-missing-imports
          mypy --config-file mypy-strict.ini --follow-imports=normal eggcalc/units.py eggcalc/mcp/server.py eggcalc/_protocol.py eggcalc/_version.py build_single.py
          mypy --config-file mypy-strict.ini --strict --follow-imports=normal tests/typing/consumer.py
          PYTHONPATH=. python tests/typing/consumer.py

      - name: Build single-file distribution
        run: |
          python build_single.py --validate
          python build_single.py

      - name: Validate authority and deterministic build
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python scripts/check_authority_boundaries.py
          python scripts/release_inventory.py --check
          python scripts/verify_unit_baseline_fixture.py tests/fixtures/units/legacy-5a1bb34c.json
          python scripts/check_evidence_consistency.py --candidate-state
          python build_single.py -o /tmp/eggcalc-build-a.py
          python build_single.py -o /tmp/eggcalc-build-b.py
          cmp /tmp/eggcalc-build-a.py /tmp/eggcalc-build-b.py

      - name: Focused closure suites
        if: matrix.python-version == '3.11'
        run: |
          python -m pytest tests/test_final_mcp_authority_closure.py -v
          python -m pytest tests/test_final_unit_authority.py tests/test_final_unit_expression.py -v

      - name: Smoke test single-file build
        run: python eggcalc.py "5+3"

      - name: Check generated docs
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/generate_mcp_docs.py --check

      - name: Test with coverage
        run: pytest tests/ -v --cov=eggcalc --cov-report=xml --cov-report=term --junitxml=lane-results.xml

      - name: Generate lane summary
        if: always()
        env:
          CONCLUSION: ${{ job.status }}
        run: |
          python scripts/junit_to_lane_summary.py \
            --junitxml lane-results.xml \
            --os "${{ matrix.os }}" \
            --python-version "${{ matrix.python-version }}" \
            --job-name "test (${{ matrix.os }}, ${{ matrix.python-version }})" \
            --workflow-run-id "${{ github.run_id }}" \
            --workflow-head-sha "${{ github.sha }}" \
            --conclusion "$CONCLUSION" \
            --output lane-summary-${{ matrix.os }}-${{ matrix.python-version }}.json

      - name: Upload lane summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-summary-${{ matrix.os }}-${{ matrix.python-version }}
          path: lane-summary-${{ matrix.os }}-${{ matrix.python-version }}.json

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Lint summary
        if: matrix.os == 'ubuntu-latest' && always()
        run: |
          python -c "
          import json
          import subprocess
          from pathlib import Path
          # Run ruff, capture status; structured summary.
          result = subprocess.run(['ruff', 'check', 'eggcalc', 'tests'], capture_output=True, text=True)
          summary = {
            'check': 'ruff-ordinary',
            'conclusion': 'success' if result.returncode == 0 else 'failure',
            'output': (result.stdout + result.stderr)[:2048],
            'workflow_run_id': '${{ github.run_id }}',
            'workflow_head_sha': '${{ github.sha }}',
          }
          Path('lint-summary.json').write_text(json.dumps(summary, indent=2))
          if result.returncode != 0:
            raise SystemExit(1)
          "

      - name: Upload lint summary
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-summary
          path: lint-summary.json

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distributions
        run: twine check dist/*

      - name: Install wheel in clean venv
        run: |
          python -m venv /tmp/test-venv
          /tmp/test-venv/bin/pip install dist/*.whl

      - name: Smoke test
        run: |
          /tmp/test-venv/bin/python -c "from eggcalc import evaluate; assert evaluate('2+2') == 4, 'eval failed'"
          /tmp/test-venv/bin/python -c "from eggcalc.units import UnitValue; assert UnitValue(1, 'm').convert_to('ft').value > 3, 'unit conversion failed'"

      - name: Release-surface smoke tests
        run: python scripts/smoke_release_surfaces.py

      - name: Installed-wheel typed consumer
        run: python scripts/verify_wheel_consumer.py dist/*.whl

      - name: Generate release inventory
        run: |
          python build_single.py -o /tmp/eggcalc-release.py
          python scripts/release_inventory.py \
            --wheel dist/*.whl \
            --single-file /tmp/eggcalc-release.py \
            --output inventory.json

      - name: Compute artifact hashes
        run: |
          python -c "
          import hashlib, json
          from pathlib import Path
          def sha256(p):
              h = hashlib.sha256()
              h.update(Path(p).read_bytes().replace(b'\r\n', b'\n'))
              return h.hexdigest()
          hashes = {}
          for f in sorted(Path('dist').iterdir()):
              hashes[f.name] = {'sha256': sha256(f), 'size_bytes': f.stat().st_size}
          hashes['eggcalc_release.py'] = {'sha256': sha256('/tmp/eggcalc-release.py'), 'size_bytes': Path('/tmp/eggcalc-release.py').stat().st_size}
          Path('artifact-hashes.json').write_text(json.dumps(hashes, indent=2))
          "

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: release-inventory
          path: inventory.json

      - name: Upload artifact hashes
        uses: actions/upload-artifact@v4
        with:
          name: artifact-hashes
          path: artifact-hashes.json
