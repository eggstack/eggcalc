name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check eggcalc tests

      - name: Format check
        run: black --check eggcalc tests

      - name: Build single-file distribution
        run: python build_single.py

      - name: Smoke test single-file build
        run: python eggcalc.py "5+3"

      - name: Test with coverage
        run: pytest tests/ -v --cov=eggcalc --cov-report=xml --cov-report=term

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@65462800fd760344b4a28f90c4b08159ed24eb59  # v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Type check
        if: matrix.python-version == '3.12'
        run: mypy eggcalc --ignore-missing-imports
