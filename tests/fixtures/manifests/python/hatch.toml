[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hatch-demo"
version = "0.2.0"
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["src/mypkg"]

[tool.hatch.envs.default]
dependencies = ["pytest"]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"
