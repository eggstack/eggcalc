[workspace]
members = ["crates/*"]

[workspace.dependencies]
serde = "1.0"
tokio = { version = "1.0", features = ["full"] }

[package]
name = "my-crate"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
