[mypy]
python_version = 3.11
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
# Follow imports for type resolution but suppress errors from non-strict
# modules. The source consumer (tests/typing/consumer.py) is checked with
# explicit --strict --follow-imports=normal in CI separately.
follow_imports = silent

[mypy-eggcalc.units]
strict = true

[mypy-eggcalc.mcp.server]
strict = true

[mypy-eggcalc._protocol]
strict = true

[mypy-eggcalc._version]
strict = true

[mypy-build_single]
strict = true

[mypy-tests.typing.consumer]
strict = true

# Non-migrated modules: suppress strict-mode type-arg errors that arise
# when --follow-imports=normal pulls them in transitively from migrated modules.
[mypy-eggcalc.exact.*]
disallow_any_generics = false
warn_return_any = false

[mypy-eggcalc.normalize]
disallow_any_generics = false
warn_return_any = false

[mypy-eggcalc.evaluator]
disallow_any_generics = false
warn_return_any = false

[mypy-eggcalc.mcp.tools]
disallow_any_generics = false
warn_return_any = false
