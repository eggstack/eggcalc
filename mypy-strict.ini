[mypy]
python_version = 3.11
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
# Follow imports for type resolution but suppress errors from non-strict
# modules (replaces the previous follow_imports = skip which prevented
# type resolution entirely).
follow_imports = silent

[mypy-eggcalc.units]
strict = true

[mypy-eggcalc.mcp.server]
strict = true

[mypy-eggcalc._protocol]
strict = true

[mypy-eggcalc._version]
strict = true

[mypy-build_single]
strict = true

[mypy-tests.typing.consumer]
strict = true
