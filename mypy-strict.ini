[mypy]
python_version = 3.11
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
# The strict contract is scoped to the migrated closure modules.  Their
# legacy exact/tool dependencies retain the repository's ordinary type
# profile; the public consumer is checked separately with normal imports.
follow_imports = skip

[mypy-eggcalc.units]
strict = true

[mypy-eggcalc.mcp.server]
strict = true

[mypy-eggcalc._protocol]
strict = true

[mypy-eggcalc._version]
strict = true

[mypy-build_single]
strict = true

[mypy-tests.typing.consumer]
strict = true
