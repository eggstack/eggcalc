[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eggcalc"
dynamic = ["version"]
description = "CLI calculator accepting natural language and unit conversion. Can be used as a CLI, python library, or MCP server for AI agents."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "David Bowman", email = "dbowman91@proton.me"}
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
keywords = ["calculator", "math", "natural-language", "cli", "expression-evaluator", "unit-converter", "mathematical-parser", "mcp", "agent"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=24.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
    "pre-commit>=3.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]

[project.scripts]
calc = "eggcalc.cli:main"

[project.urls]
Homepage = "https://github.com/eggstack/eggcalc"
Repository = "https://github.com/eggstack/eggcalc"
"Bug Tracker" = "https://github.com/eggstack/eggcalc/issues"
Changelog = "https://github.com/eggstack/eggcalc/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["eggcalc*"]

[tool.setuptools.dynamic]
version = {attr = "eggcalc._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313", "py314"]
skip-string-normalization = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "E731",  # do not assign lambda expression
    "E741",  # ambiguous variable name
    "E402",  # module level import not at top of file
    "B006",  # do not use mutable data structures for argument defaults
    "B007",  # loop control variable not used
    "B904",  # raise ... from err (too noisy for existing code)
    "B905",  # zip() without strict= parameter
    "C414",  # unnecessary list() call within sorted()
    "C416",  # unnecessary list/dict comprehension
    "F841",  # local variable assigned but never used
    "W293",  # blank line contains whitespace (intentional in patch fixtures)
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "eggcalc.cli",
    "eggcalc.units",
    "eggcalc.normalize",
    "eggcalc.evaluator",
    "eggcalc.capabilities",
    "eggcalc._protocol",
]
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
